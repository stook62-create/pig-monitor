name: 双周自动监测

# 每月 1 日 / 15 日 北京时间 09:23（UTC 01:23）自动运行：
# 拉取最新行情 → 重跑监测引擎 → 存档历史版本 → 构建并部署到 Pages
# 也可在 Actions 页面手动 Run workflow 触发
on:
  schedule:
    - cron: '23 1 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  monitor-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 自动采集数据并重建当前快照
        run: python monitor.py --refresh

      - name: 存档本期历史版本
        run: python monitor.py --save

      - name: 提交数据与存档回仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "双周自动监测：更新快照并存档 ${{ github.run_number }}"
          file_pattern: "src/data/state.json reports/*.json settings.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
